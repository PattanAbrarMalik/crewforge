name: Verify CrewForge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:chaos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-evidence
          path: reports/chaos.json
